<div class="products-container">
  <h2>Inventario de Medicamentos</h2>

  <div class="filter-container">
    <input 
      type="text" 
      pInputText 
      placeholder="Buscar por nombre o categoría..." 
      [(ngModel)]="filterText" />
  </div>

  <p-table 
    [value]="productos" 
    [paginator]="true" 
    [rows]="5" 
    [rowsPerPageOptions]="[5,10,20]" 
    [tableStyle]="{ 'min-width': '50rem' }">
    
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Laboratorio</th>
        <th>Fecha de Fabricación</th>
        <th>Fecha de Vencimiento</th>
        <th>Stock</th>
        <th>Valor Unitario ($)</th>
        
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-med>
      <tr>
        <td>{{ med.nombre }}</td>
        <td>{{ med.laboratorio }}</td>
        <td>{{ med.fechaFabricacion }}</td>
        <td>{{ med.fechaVencimiento }}</td>
        <td>{{ med.cantidadStock }}</td>
        <td>{{ med.valorUnitario | number:'1.2-2' }}</td>
       

        <td>
          <p-button 
            label="Editar" 
            severity="secondary" 
            (click)="editarProducto(med)" 
            class="btn-rounded">
          </p-button>

          <p-button 
            label="Eliminar" 
            severity="danger" 
            (click)="eliminarProducto(med)" 
            class="btn-rounded">
          </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- ✅ Modal protegido con *ngIf -->
  <p-dialog 
    header="Editar Medicamento" 
    [(visible)]="displayEditDialog" 
    [modal]="true" 
    [closable]="false" 
    [style]="{width: '400px'}">

    <div *ngIf="selectedMed">
      <div class="p-field">
        <label>Nombre</label>
        <input type="text" pInputText [(ngModel)]="selectedMed.nombre">
      </div>

      <div class="p-field">
        <label>Laboratorio</label>
        <input type="text" pInputText [(ngModel)]="selectedMed.laboratorio">
      </div>

      <div class="p-field">
        <label>Fecha de Fabricación</label>
        <input type="date" pInputText [(ngModel)]="selectedMed.fechaFabricacion">
      </div>

      <div class="p-field">
        <label>Fecha de Vencimiento</label>
        <input type="date" pInputText [(ngModel)]="selectedMed.fechaVencimiento">
      </div>

      <div class="p-field">
        <label>Stock</label>
        <input type="number" pInputText [(ngModel)]="selectedMed.cantidadStock">
      </div>

      <div class="p-field">
        <label>Precio</label>
        <input type="number" pInputText [(ngModel)]="selectedMed.valorUnitario">
      </div>
    </div>

    
    <ng-template pTemplate="footer">
      <p-button 
        label="Cancelar" 
        (click)="cancelarEdicion()" 
        class="p-button-text">
      </p-button>

      <p-button 
        label="Guardar" 
        (click)="guardarEdicion()">
      </p-button>
    </ng-template>
  </p-dialog>

  
  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>
</div>
